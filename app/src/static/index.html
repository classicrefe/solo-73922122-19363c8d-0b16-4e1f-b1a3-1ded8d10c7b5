<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>HLS 直播连续录音采集</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
  input[type=text] { width: 70%; padding: .45rem; font-size: .95rem; }
  button { padding: .45rem 1rem; font-size: .95rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border-bottom: 1px solid #eee; padding: .45rem .5rem; text-align: left; vertical-align: top; }
  .state-recording { color: #1565c0; font-weight: 600; }
  .state-finalizing { color: #ef6c00; font-weight: 600; }
  .state-done { color: #2e7d32; font-weight: 600; }
  .state-failed { color: #c62828; font-weight: 600; }
  .err { color: #c62828; }
  .muted { color: #777; font-size: .85rem; }
  code { background: #f4f4f4; padding: 0 .3rem; border-radius: 4px; }
  .mute-box { margin-top: .6rem; padding-top: .5rem; border-top: 1px dashed #ccc; max-width: 420px; }
  .mute-input { width: 100%; box-sizing: border-box; margin: .35rem 0; padding: .4rem; }
  .mute-list { margin: .4rem 0 0; padding-left: 1.1rem; font-size: .85rem; }
  .mute-list li { margin-bottom: .25rem; }
</style>
</head>
<body>
<h1>HLS 直播连续录音采集</h1>

<div class="card">
  <div>
    <input id="url" type="text" placeholder="http://livesource:8080/live.m3u8">
    <button onclick="startJob()">开始录制</button>
  </div>
  <p class="muted">
    仅接受单层、未加密、无不连续标记的 MPEG-TS 媒体清单，片段地址不复用。
    本机直播源示例：<code>http://livesource:8080/live.m3u8</code>（普通）、
    <code>http://livesource:8080/live.m3u8?delay_ms=1500</code>（慢下载）、
    <code>http://livesource:8080/live.m3u8?missing=12</code>（缺段）、
    <code>http://livesource:8080/live.m3u8?jump_at=10&amp;jump_by=8</code>（窗口跳号）。
  </p>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>ID</th><th>清单地址</th><th>状态</th><th>进度</th><th>窗口</th><th>缺段/错误</th><th>操作</th></tr>
    </thead>
    <tbody id="jobs"></tbody>
  </table>
</div>

<script>
// Keep half-entered mute intervals across the 2s table refresh.
const muteDraft = {};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function renderMutes(jobId, mutes) {
  if (!mutes || !mutes.length) return '';
  const rows = mutes.map(m => {
    let body;
    if (m.state === 'ready') {
      body = `<a href="${m.download_url}">下载消音 WAV</a>`
        + ` <span class="muted">(${m.muted_samples}/${m.total_samples} 样本置零)</span>`;
    } else if (m.state === 'failed') {
      body = `<span class="err">失败: ${esc(m.error)}</span>`;
    } else {
      body = `<span class="state-finalizing">处理中…</span>`;
    }
    const warn = m.warning ? `<br><span class="muted">${esc(m.warning)}</span>` : '';
    return `<li>#${m.id} ${body}${warn}</li>`;
  }).join('');
  return `<ul class="mute-list">${rows}</ul>`;
}

async function submitMute(jobId) {
  const raw = (muteDraft[jobId] || '').trim();
  if (!raw) { alert('请填写至少一个区间，格式 起点-终点（秒），多个区间用逗号或分号分隔'); return; }
  const intervals = [];
  for (const part of raw.split(/[,;，；]/)) {
    const p = part.trim();
    if (!p) continue;
    const m = p.match(/^(\d+(?:\.\d+)?)\s*[-~]\s*(\d+(?:\.\d+)?)$/);
    if (!m) { alert(`区间格式无法识别: “${p}”，示例: 12.5-18 或 30-33.2`); return; }
    intervals.push({start: parseFloat(m[1]), end: parseFloat(m[2])});
  }
  if (!intervals.length) { alert('请填写至少一个有效区间'); return; }
  const r = await fetch(`/api/jobs/${jobId}/mute`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({intervals})
  });
  if (!r.ok) { alert('消音请求被拒: ' + (await r.json()).detail); return; }
  refresh();
}

async function refresh() {
  try {
    const r = await fetch('/api/jobs');
    const jobs = await r.json();
    const tbody = document.getElementById('jobs');
    tbody.innerHTML = '';
    for (const j of jobs) {
      const tr = document.createElement('tr');
      const win = (j.first_seq === null) ? '—'
        : `${j.first_seq} .. ${j.last_seq}` + (j.stop_seq !== null ? `（止于 ${j.stop_seq}）` : '');
      const miss = (j.missing && j.missing.length) ? `<span class="err">缺段: ${j.missing.join(', ')}</span><br>` : '';
      const err = j.error ? `<span class="err">${esc(j.error)}</span>` : '';
      let ops = '';
      if (j.state === 'recording') ops += `<button onclick="stopJob(${j.id})">停止</button> `;
      if (j.state === 'done') {
        ops += `<a href="${j.download_url}">下载 ZIP</a>`;
        const draft = esc(muteDraft[j.id] || '');
        ops += `<div class="mute-box">
          <div><b>消音（秒，按录音起点计）</b></div>
          <input type="text" class="mute-input" data-job="${j.id}"
                 placeholder="例: 12.5-18, 30-33.2" value="${draft}">
          <button onclick="submitMute(${j.id})">生成消音 WAV</button>
          <div id="mutes-${j.id}"></div>
        </div>`;
      }
      tr.innerHTML = `<td>${j.id}</td><td style="word-break:break-all">${esc(j.url)}</td>`
        + `<td class="state-${esc(j.state)}">${esc(j.state)}</td>`
        + `<td>${j.saved} / ${j.expected}</td><td>${esc(win)}</td>`
        + `<td>${miss}${err}</td><td>${ops}</td>`;
      tbody.appendChild(tr);
    }
    document.querySelectorAll('.mute-input').forEach(inp => {
      inp.addEventListener('input', e => { muteDraft[inp.dataset.job] = e.target.value; });
    });
    for (const j of jobs) {
      if (j.state !== 'done') continue;
      const mr = await fetch(`/api/jobs/${j.id}/mutes`);
      if (mr.ok) document.getElementById(`mutes-${j.id}`).innerHTML = renderMutes(j.id, await mr.json());
    }
  } catch (e) { console.error(e); }
}
async function startJob() {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const r = await fetch('/api/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})});
  if (!r.ok) alert('开始失败: ' + (await r.json()).detail);
  refresh();
}
async function stopJob(id) {
  await fetch(`/api/jobs/${id}/stop`, {method: 'POST'});
  refresh();
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
